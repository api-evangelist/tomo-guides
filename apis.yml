name: Tomo Guides
description: >-
  Tomo Guides is the home-buying guide and educational content produced by Tomo
  Mortgage (tomo.com), a consumer digital mortgage lender backed by a16z. Tomo
  offers home purchase mortgages and refinancing with $0 lender fees and rates
  advertised at roughly 0.25% below the market median, alongside its TrueRate
  tool that shows a fair rate before applying and state-by-state
  interest-rate pages. The "Guides" surface is Tomo's home-buying-guide blog
  content aimed at first-time and repeat buyers, not a developer product. As of
  this enrichment pass Tomo publishes no public developer API, OpenAPI
  definition, developer portal, documentation site, or .well-known metadata; the
  company's web presence is entirely consumer-facing. This profile was surfaced
  as an a16z portfolio company and is retained as a company record with no API
  artifacts.
